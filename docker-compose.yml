name: hedged-lab

services:
  upstream:
    build: .
    command: uvicorn upstream.server:app --host 0.0.0.0 --port 8080
    environment:
      MEDIAN_MS: "120"
      STALL_RATE: "0.02"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    environment:
      UPSTREAM_URL: http://upstream:8080/generate
      TIMEOUT_S: "2.0"
      BUDGET_RATIO: "0.1"
    ports: ["8000:8000"]
    depends_on:
      upstream: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hedging.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  k6:
    image: grafana/k6:0.55.0
    profiles: ["load"]
    command: run /scripts/script.js
    environment:
      TARGET: http://gateway:8000
      MODE: ${MODE:-hedged}
      RATE: ${RATE:-50}
      DURATION: ${DURATION:-3m}
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      gateway: {condition: service_healthy}
